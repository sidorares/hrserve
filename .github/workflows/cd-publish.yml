name: '🚀 CD — Publish'

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Release Please
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - name: 🤝 Release Please
        uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: node
          skip-labeling: true
          
      - name: 📊 Debug Release Please Outputs
        run: |
          echo "releases_created: ${{ steps.release.outputs.releases_created }}"
          echo "release_created: ${{ steps.release.outputs.release_created }}"
          echo "tag_name: ${{ steps.release.outputs.tag_name }}"
          echo "prs_created: ${{ steps.release.outputs.prs_created }}"

  # Publishes via npm trusted publishing (OIDC) — no NPM_TOKEN secret.
  # One-time setup on npmjs.com (package Settings → Trusted Publisher):
  #   GitHub Actions / user: sidorares / repository: hrserve /
  #   workflow filename: cd-publish.yml (no environment)
  publish:
    needs: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Publish to NPM
    if: ${{ needs.release-please.outputs.releases_created }}
    permissions:
      contents: read
      id-token: write # mint the OIDC token npm exchanges for publish credentials
    steps:
      - name: ➕ Actions - Checkout
        uses: actions/checkout@v4

      - name: ➕ Actions - Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm >= 11.5.1; Node 24 bundles it (22.x ships npm 10)
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      # No dependency cache here on purpose: release builds should not trust caches

      - name: 📦 Installing Dependencies
        run: npm ci

      - name: 🔍 Check package version before publish
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "Package version: $PACKAGE_VERSION"
          echo "Tag name: ${{ needs.release-please.outputs.tag_name }}"
          
          # Check if version exists on npm
          if npm view hrserve@$PACKAGE_VERSION version 2>/dev/null; then
            echo "❌ Version $PACKAGE_VERSION already exists on npm"
            exit 1
          else
            echo "✅ Version $PACKAGE_VERSION is new, proceeding with publish"
          fi

      - name: 📥 Publishing Package
        # No NODE_AUTH_TOKEN: npm authenticates via OIDC (trusted publishing)
        # and generates provenance attestations automatically.
        run: npm publish
